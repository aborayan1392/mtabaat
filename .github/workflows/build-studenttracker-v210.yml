name: Build StudentTracker v2.1.0

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  build:
    if: contains(github.event.pull_request.title, 'StudentTracker v2.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;$BUILD_TOOLS_VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore source
        run: |
          set -euo pipefail
          mkdir -p work/project dist
          cat studenttracker-build/source/part-000.b64 studenttracker-build/source/part-001.b64 studenttracker-build/source/part-002.b64 studenttracker-build/tail/part-*.b64 > work/source.b64
          test "$(wc -c < work/source.b64)" -eq 66368
          base64 --decode work/source.b64 > work/source.tar.xz
          tar -tJf work/source.tar.xz >/dev/null
          tar -xJf work/source.tar.xz -C work/project
          test -f work/project/settings.gradle
          grep -q "versionName '2.1.0'" work/project/app/build.gradle

      - name: Build release APK
        working-directory: work/project
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore work/studenttracker-v210.p12 -storetype PKCS12 -storepass android -keypass android -alias studenttracker -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StudentTracker v2.1.0,O=Aborayan App,C=SA"

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/$BUILD_TOOLS_VERSION"
          "$BT/zipalign" -p -f 4 work/project/app/build/outputs/apk/release/app-release-unsigned.apk work/aligned.apk
          "$BT/apksigner" sign --ks work/studenttracker-v210.p12 --ks-type PKCS12 --ks-key-alias studenttracker --ks-pass pass:android --key-pass pass:android --out dist/StudentTracker-v2.1.0.apk work/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs dist/StudentTracker-v2.1.0.apk
          sha256sum dist/StudentTracker-v2.1.0.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentTracker-v2.1.0
          path: |
            dist/StudentTracker-v2.1.0.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
