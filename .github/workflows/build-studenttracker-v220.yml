name: Build StudentTracker v2.2.0

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS_VERSION: '35.0.0'

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'studenttracker-v210-temp-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: studenttracker-v210-temp-build
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;$BUILD_TOOLS_VERSION" "platform-tools"

      - name: Restore clean v2.1.0 source and apply v2.2.0 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/project dist
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, zipfile, io, sys

          parts = sorted(Path('studenttracker-v210-source').glob('part-*.b64'))
          if not parts:
              raise SystemExit('No v2.1 source chunks found')

          texts = []
          for p in parts:
              raw = p.read_text(encoding='utf-8', errors='strict')
              clean = re.sub(r'\s+', '', raw)
              texts.append(clean)
              print(f'{p.name}: chars={len(clean)} equals={clean.count("=")} start={clean[:12]} end={clean[-12:]}')

          def decode_text(s):
              s = re.sub(r'\s+', '', s)
              return base64.b64decode(s, validate=False)

          candidates = []
          joined = ''.join(texts)
          candidates.append(('joined', lambda: decode_text(joined)))

          # Some historical chunks were stored with their own padding. Remove internal
          # padding and restore legal padding only once at the end.
          noeq = ''.join(t.replace('=', '') for t in texts)
          noeq += '=' * ((4 - len(noeq) % 4) % 4)
          candidates.append(('joined-no-internal-padding', lambda: decode_text(noeq)))

          # Also test decoding each chunk independently, repairing padding as needed.
          def per_part():
              out = bytearray()
              for t in texts:
                  q = t.replace('=', '')
                  q += '=' * ((4 - len(q) % 4) % 4)
                  out.extend(decode_text(q))
              return bytes(out)
          candidates.append(('per-part', per_part))

          errors = []
          for name, fn in candidates:
              try:
                  data = fn()
                  bio = io.BytesIO(data)
                  with zipfile.ZipFile(bio) as z:
                      bad = z.testzip()
                      if bad is not None:
                          raise RuntimeError(f'CRC failure: {bad}')
                      names = set(z.namelist())
                      if 'app/build.gradle' not in names:
                          raise RuntimeError('app/build.gradle missing')
                  Path('work/base-v210.zip').write_bytes(data)
                  print(f'RECOVERY_OK={name} bytes={len(data)}')
                  break
              except Exception as e:
                  errors.append(f'{name}: {e}')
          else:
              print('\n'.join(errors), file=sys.stderr)
              raise SystemExit('Could not recover v2.1 source ZIP')
          PY
          unzip -tq work/base-v210.zip
          unzip -q work/base-v210.zip -d work/project
          test -f work/project/app/build.gradle
          grep -q "versionName '2.1.0'" work/project/app/build.gradle
          cd work/project
          patch -p2 < ../../studenttracker-v210-source/studenttracker-v220.patch
          grep -q "versionName '2.2.0'" app/build.gradle
          grep -q "نقل الطالب" app/src/main/java/com/aborayan/studenttracker/StudentDetailActivity.java
          grep -q "moveStudent(long studentId" app/src/main/java/com/aborayan/studenttracker/DatabaseHelper.java

      - name: Build release APK
        shell: bash
        working-directory: work/project
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore work/studenttracker-v220.p12 -storetype PKCS12 -storepass android -keypass android -alias studenttracker -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StudentTracker v2.2.0,O=Aborayan App,C=SA"

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/$BUILD_TOOLS_VERSION"
          "$BT/zipalign" -p -f 4 work/project/app/build/outputs/apk/release/app-release-unsigned.apk work/aligned.apk
          "$BT/apksigner" sign --ks work/studenttracker-v220.p12 --ks-type PKCS12 --ks-key-alias studenttracker --ks-pass pass:android --key-pass pass:android --out dist/StudentTracker-v2.2.0.apk work/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs dist/StudentTracker-v2.2.0.apk
          unzip -tq dist/StudentTracker-v2.2.0.apk
          sha256sum dist/StudentTracker-v2.2.0.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentTracker-v2.2.0
          path: |
            dist/StudentTracker-v2.2.0.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
