name: Build StudentTracker v2.2.0

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'studenttracker-v210-temp-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: studenttracker-v210-temp-build
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Reconstruct source and apply transfer patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/project
          cat studenttracker-v210-source/part-*.b64 > work/source.raw.b64
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          raw = Path('work/source.raw.b64').read_text(encoding='utf-8', errors='ignore')
          clean = re.sub(r'[^A-Za-z0-9+/]', '', raw)
          clean += '=' * ((-len(clean)) % 4)
          data = base64.b64decode(clean, validate=False)
          Path('work/source.zip').write_bytes(data)
          print('clean base64 chars:', len(clean), 'decoded bytes:', len(data))
          PY
          unzip -tq work/source.zip
          unzip -q work/source.zip -d work/project
          cd work/project
          patch -p1 < ../../studenttracker-v210-source/studenttracker-v220.patch
          grep -R "versionName '2.2.0'" -n StudentTrackerJava-v2.1.0/app/build.gradle
          grep -R "نقل الطالب" -n StudentTrackerJava-v2.1.0/app/src/main/java/com/aborayan/studenttracker/StudentDetailActivity.java

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd work/project/StudentTrackerJava-v2.1.0
          gradle --no-daemon --stacktrace assembleRelease
          mkdir -p ../../../dist
          if [ -s app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../../../dist/StudentTracker-v2.2.0-unsigned.apk
          else
            cp app/build/outputs/apk/release/app-release.apk ../../../dist/StudentTracker-v2.2.0-unsigned.apk
          fi
          test -s ../../../dist/StudentTracker-v2.2.0-unsigned.apk
          unzip -tq ../../../dist/StudentTracker-v2.2.0-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentTracker-v2.2.0-unsigned
          path: dist/StudentTracker-v2.2.0-unsigned.apk
          if-no-files-found: error
          retention-days: 7
