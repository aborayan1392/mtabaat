name: Build StudentTracker v2.2.0

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TOOLS_VERSION: '35.0.0'
  SOURCE_B64_SHA256: '5793b818c26833043fd80cee943aea2dc0f63a1f66074cf2b5a4902e42cfb498'

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'studenttracker-v210-temp-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: studenttracker-v210-temp-build
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;$BUILD_TOOLS_VERSION" "platform-tools"

      - name: Restore and verify v2.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/project dist

          # Repair the single corrupted Base64 character in the historical source chunk.
          # The complete bundle hash below proves the reconstructed source is byte-for-byte
          # identical to the validated local v2.2.0 source before it is decoded or built.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('studenttracker-v220-source/part-008.b64')
          s = p.read_text(encoding='utf-8')
          old = 'BmXvutiXevVV7xJ7IlRfI4xbh8PkUdotBVBq+MMhMGG1wpSAsC'
          new = 'BmXvktiXevVV7xJ7IlRfI4xbh8PkUdotBVBq+MMhMGG1wpSAsC'
          if old not in s:
              raise SystemExit('Expected repair marker not found in part-008')
          s2 = s.replace(old, new, 1)
          if s2.count(old):
              raise SystemExit('Unexpected duplicate repair marker remains')
          p.write_text(s2, encoding='utf-8')
          PY

          cat studenttracker-v220-source/part-*.b64 > work/source.b64
          test "$(wc -c < work/source.b64)" -eq 126388
          echo "$SOURCE_B64_SHA256  work/source.b64" | sha256sum -c -
          base64 --decode work/source.b64 > work/source.zip
          unzip -tq work/source.zip
          unzip -q work/source.zip -d work/project

          ROOT="work/project/StudentTrackerJava-v2.1.0"
          test -f "$ROOT/app/build.gradle"
          grep -q "versionName '2.2.0'" "$ROOT/app/build.gradle"
          grep -q "versionCode 15" "$ROOT/app/build.gradle"
          grep -q "نقل الطالب" "$ROOT/app/src/main/java/com/aborayan/studenttracker/StudentDetailActivity.java"
          grep -q "moveStudent(long studentId" "$ROOT/app/src/main/java/com/aborayan/studenttracker/DatabaseHelper.java"

      - name: Build release APK
        shell: bash
        working-directory: work/project/StudentTrackerJava-v2.1.0
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -tq app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore work/studenttracker-v220.p12 -storetype PKCS12 -storepass android -keypass android -alias studenttracker -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StudentTracker v2.2.0,O=Aborayan App,C=SA"

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/$BUILD_TOOLS_VERSION"
          UNSIGNED="work/project/StudentTrackerJava-v2.1.0/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" work/aligned.apk
          "$BT/apksigner" sign --ks work/studenttracker-v220.p12 --ks-type PKCS12 --ks-key-alias studenttracker --ks-pass pass:android --key-pass pass:android --out dist/StudentTracker-v2.2.0.apk work/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs dist/StudentTracker-v2.2.0.apk
          unzip -tq dist/StudentTracker-v2.2.0.apk
          sha256sum dist/StudentTracker-v2.2.0.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentTracker-v2.2.0
          path: |
            dist/StudentTracker-v2.2.0.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
