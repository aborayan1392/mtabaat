name: Build StudentTracker v2.2.0

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'studenttracker-v210-temp-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: studenttracker-v210-temp-build
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Reconstruct v2.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/project
          : > work/source.zip
          for part in $(find studenttracker-v220-source -maxdepth 1 -type f -name 'part-*.b64' | sort); do
            echo "Decoding $part"
            base64 --decode "$part" >> work/source.zip
          done
          unzip -tq work/source.zip
          unzip -q work/source.zip -d work/project
          grep -R "versionName '2.2.0'" -n work/project/StudentTrackerJava-v2.1.0/app/build.gradle
          grep -R "نقل الطالب" -n work/project/StudentTrackerJava-v2.1.0/app/src/main/java/com/aborayan/studenttracker/StudentDetailActivity.java

      - name: Build release APK and capture compiler log
        id: compile
        shell: bash
        run: |
          set +e
          cd work/project/StudentTrackerJava-v2.1.0
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee ../../../build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          mkdir -p ../../../dist
          if [ "$STATUS" -eq 0 ]; then
            if [ -s app/build/outputs/apk/release/app-release-unsigned.apk ]; then
              cp app/build/outputs/apk/release/app-release-unsigned.apk ../../../dist/StudentTracker-v2.2.0-unsigned.apk
            else
              cp app/build/outputs/apk/release/app-release.apk ../../../dist/StudentTracker-v2.2.0-unsigned.apk
            fi
            unzip -tq ../../../dist/StudentTracker-v2.2.0-unsigned.apk
          else
            grep -n -B 3 -A 8 "error:" ../../../build.log > ../../../compile-errors.txt || tail -300 ../../../build.log > ../../../compile-errors.txt
          fi
          exit 0

      - name: Upload compile diagnostics
        if: steps.compile.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: StudentTracker-v2.2.0-compile-errors
          path: |
            build.log
            compile-errors.txt
          if-no-files-found: error
          retention-days: 3

      - name: Fail if compilation failed
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Upload unsigned APK
        if: steps.compile.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: StudentTracker-v2.2.0-unsigned
          path: dist/StudentTracker-v2.2.0-unsigned.apk
          if-no-files-found: error
          retention-days: 7
